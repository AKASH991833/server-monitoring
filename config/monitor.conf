# ============================================================
# server-monitoring configuration
# All thresholds are percentages unless the name says otherwise.
# WARN  = something to look at, CRIT = act now.
# ============================================================

# --- CPU (usage % over a short sample window) ---
CPU_WARN=80
CPU_CRIT=95

# --- Load average (1-min load per CPU core) ---
# Example: on a 4-core box, LOAD_WARN_PER_CORE=2.0 means warn at load 8.0
LOAD_WARN_PER_CORE=2.0
LOAD_CRIT_PER_CORE=4.0

# --- Memory (used %, Linux "available" memory accounting) ---
MEM_WARN=80
MEM_CRIT=95

# --- Disk (used % of each mounted filesystem) ---
DISK_WARN=80
DISK_CRIT=90

# --- Inodes (used % - a full inode table breaks writes even with free space) ---
INODE_WARN=80
INODE_CRIT=90

# Mounts to check, space-separated. Empty = every real local filesystem
# (tmpfs, devtmpfs, squashfs and overlay filesystems are skipped automatically).
DISK_MOUNTS=""

# --- Services (systemd unit names, space-separated) ---
SERVICES="ssh cron"

# --- Alert behaviour ---
# Minimum minutes between two alerts for the same problem (avoids spam).
ALERT_COOLDOWN_MIN=30

# Enable channels here; credentials live in config/secrets.env (never commit it).
ALERT_EMAIL=no
ALERT_TELEGRAM=no

# --- Paths (install.sh rewrites these to absolute paths) ---
LOG_DIR="./logs"
STATE_DIR="./state"
